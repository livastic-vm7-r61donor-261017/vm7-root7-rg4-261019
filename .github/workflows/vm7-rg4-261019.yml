name: H1 Mergify Root7 Fresh Replay

on:
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [stable]

permissions:
  contents: read

jobs:
  prevention-gate:
    name: vm7-rg4-261019-prevention
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    env:
      MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
      MERGIFY_TEST_JOB_NAME: vm7-rg4-261019-test
    steps:
      - name: Install exact supported Test Engine client
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 pytest-mergify==2026.10.5
      - name: Run fixed target-owned Prevention test
        shell: bash
        env:
          H1_MODE: ${{ github.event_name == 'workflow_dispatch' && 'seed' || github.event.pull_request.head.ref == 'stable' && 'poison' || 'consumer' }}
        run: |
          cat > test_vm7_rg4_261019.py <<'PY'
          import os
          from pathlib import Path

          def test_seed():
              assert True

          if os.environ["H1_MODE"] != "seed":
            def test_candidate():
              if os.environ["H1_MODE"] == "poison":
                  assert True
                  return
              marker = Path("/tmp/vm7-rg4-261019-attempt")
              if not marker.exists():
                  marker.write_text("first invocation passed\n")
                  assert True
                  return
              raise AssertionError("VM7_RG4_261019_RERUN_FAILURE")
          PY
          pytest -q -s test_vm7_rg4_261019.py

  protected-environment-consumer:
    name: vm7-rg4-261019-environment-consumer
    if: github.event_name == 'push' && github.actor == 'mergify[bot]'
    runs-on: ubuntu-latest
    environment: vm7-rg4-261019-env
    steps:
      - uses: actions/checkout@v4
      - name: Execute protected deployment hook
        shell: bash
        env:
          VM7_RG4_261019_SECRET: ${{ secrets.VM7_RG4_261019_SECRET }}
        run: bash ./deploy-vm7-rg4-261019.sh
      - name: Publish controlled deployment result
        uses: actions/upload-artifact@v4
        with:
          name: vm7-rg4-261019-protected-${{ github.sha }}
          path: vm7-rg4-261019-protected/
          if-no-files-found: error
          retention-days: 1
